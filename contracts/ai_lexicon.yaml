# The AI lexicon: the radar's ranked unit (contracts/ai_lexicon.schema.json).
#
# Why: GDELT's organisation extractor does not recognise most AI-native entities (in 2026-W42 there is no
# org:openai, only "openai partner network"), so ranking GDELT orgs co-mentioned in AI articles filled the
# top 10 with retailers and banks. A topic is now an entry of this curated list: labs, models, products,
# techniques, infrastructure, research, business, policy, safety and the opposition to AI.
#
# Matching: an AI-ring article counts for an entry when any pattern matches txt = lower(title || ' ' || url)
# (RE2, lowercase, so URL slugs with hyphens match too) or when one of gdelt_orgs is in its GDELT orgs.
# Topic id: 'ai:' || id. Persons are never entries. A change here is a contract change.
#
# ranked (optional, default true): false keeps an entry as context only. It is matched, counted and drawn
# (topic_ai_daily, edges, the 1-hop ring, the graph views, the leaders as "contexto", the community and the
# agents' tools) but never ranked: no rank, decision or backtest row. The LatAm sector entries are context:
# ranked, they spiked in ways the emergence score rewards without predicting es/pt growth (the AI backtest's
# secondary label fell from 25.6% to 22.1%, below raw-count growth, measured).
version: 1

families:
  labs: Laboratorios
  models: Modelos
  products: Productos y asistentes
  techniques: Técnicas
  infra: Infraestructura y chips
  research: Investigación y open source
  business: Negocio e inversión
  policy: Regulación y política
  safety: Seguridad y riesgo
  opposition: Oposición y crítica
  society: Sociedad y trabajo

