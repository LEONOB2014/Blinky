openapi: 3.1.0
info:
  title: Radar API
  version: 0.1.0
  description: >
    Read-only API over the lake (DuckDB over Parquet) plus the agent chat. Owner: WS5 (API),
    orchestrator (chat). Schemas reference the JSON Schemas in this folder.
paths:
  /api/radar:
    get:
      summary: Weekly top 10
      parameters:
        - {name: week, in: query, schema: {type: string, pattern: "^[0-9]{4}-W[0-9]{2}$"}}
        - {name: limit, in: query, schema: {type: integer, default: 10, maximum: 50}}
      responses:
        "200":
          description: Ranked topics
          content:
            application/json:
              schema: {type: array, items: {$ref: "topic_scores_weekly.schema.json"}}
  /api/leaders:
    get:
      summary: The week's AI leaders by volume (RADAR_SOURCE=ai only; empty rows otherwise)
      description: >
        The ai: lexicon topics with the most articles that week, all languages, from
        topic_ai_daily. Days flagged is_missing are left out; change_vs_prev_week compares
        articles per day with data. Family and stance come from contracts/ai_lexicon.yaml;
        emergence_rank and decision from topic_ai_scores_weekly (null when unscored).
      parameters:
        - {name: week, in: query, schema: {type: string, pattern: "^[0-9]{4}-W[0-9]{2}$"}}
        - {name: limit, in: query, schema: {type: integer, default: 15, maximum: 50}}
      responses:
        "200":
          description: Leaders, most articles first
          content:
            application/json:
              schema:
                type: object
                required: [week, days_with_data, prev_week_days_with_data, rows]
                properties:
                  week: {type: [string, "null"]}
                  days_with_data: {type: [integer, "null"]}
                  prev_week_days_with_data: {type: [integer, "null"]}
                  rows:
                    type: array
                    items:
                      type: object
                      required: [leader_rank, topic_id, label_es, articles, articles_prev_week]
                      properties:
                        leader_rank: {type: integer, minimum: 1}
                        topic_id: {type: string, pattern: "^ai:"}
                        label_es: {type: string}
                        family: {type: [string, "null"]}
                        family_es: {type: [string, "null"]}
                        stance: {type: [string, "null"], enum: [promoter, critic, neutral, null]}
                        articles: {type: integer, minimum: 0}
                        articles_prev_week: {type: integer, minimum: 0}
                        change_vs_prev_week: {type: [number, "null"]}
                        espt_share: {type: [number, "null"], minimum: 0, maximum: 1}
                        emergence_rank: {type: [integer, "null"]}
                        decision: {type: [string, "null"]}
  /api/topic/{topic_id}/timeline:
    get:
      summary: Daily series of one topic by language
      parameters: [{name: topic_id, in: path, required: true, schema: {type: string}}]
      responses:
        "200":
          description: Series
          content:
            application/json:
              schema: {type: array, items: {$ref: "topic_daily.schema.json"}}
  /api/topic/{topic_id}/context:
    get:
      summary: The 1-hop context ring
      parameters:
        - {name: topic_id, in: path, required: true, schema: {type: string}}
        - {name: week, in: query, schema: {type: string}}
      responses:
        "200":
          description: Neighbours
          content:
            application/json:
              schema: {type: array, items: {$ref: "topic_context_1hop.schema.json"}}
  /api/freshness:
    get:
      summary: Newest data per source and the profile served (dev or full)
      responses:
        "200": {description: Freshness}
  /api/chat:
    post:
      summary: One turn with the Media Master
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                conversation_id: {type: string}
                message: {type: string, maxLength: 2000}
                week: {type: string}
      responses:
        "200":
          description: The answer, its decision cards, view commands and trace
          content:
            application/json:
              schema:
                type: object
                required: [conversation_id, answer_es, decision_cards, view_commands, trace]
                properties:
                  conversation_id: {type: string}
                  trace_id: {type: [string, "null"], description: "the turn's LangSmith trace, for POST /api/feedback; null when tracing is off"}
                  answer_es: {type: string}
                  decision_cards: {type: array, items: {$ref: "decision_card.schema.json"}}
                  view_commands: {type: array, items: {$ref: "view_command.schema.json"}}
                  trace: {type: array, items: {$ref: "agent_trace.schema.json"}}
  /api/feedback:
    post:
      summary: A reader's thumbs up or down on one chat turn (recorded on its LangSmith trace)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [trace_id, score]
              properties:
                trace_id: {type: string, description: "trace_id from the /api/chat response"}
                score: {type: integer, enum: [0, 1]}
                comment: {type: string, maxLength: 500}
      responses:
        "202": {description: Recorded}
        "429": {description: Rate limited (shares the chat quota)}
        "503": {description: Feedback is not configured (no LangSmith key on the server)}
