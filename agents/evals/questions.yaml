# Frozen evaluation set for the agents (v1, 2026-10-17). Change it only with a new version, so
# experiments stay comparable. Expectations describe intent, not the router's keywords.
#   agents: specialists that must take part (a subset; extra ones are not penalised)
#   entity: the graph id the question is about, when it names one
#   decision: true when the answer should carry a code-computed decision
#   kind: the question family, for per-family scores
version: 1
questions:
